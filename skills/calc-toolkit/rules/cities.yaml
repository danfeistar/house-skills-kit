      base_cap_couple: 1000000     # 双缴存人 100 万
      balance_multiple: 20         # 余额倍数演示值（中心按个贷率等动态调整，待官方公式页复核）
      boost_multi_child: 0.30      # 多子女（首套+二套）上浮30% → 单91万/双130万
      boost_green: 0.20            # 现房/星级绿建/绿色生态小区 上浮20% → 单84万/双120万
      boost_cap: 0.50              # 两情形叠加至+50% → 单105万/双150万
      boost_elite: 0.50            # 高层次人才（兴滇惠才卡/春城惠才卡）上浮50% → 单105万/双150万
    commission:                    # 昆明市中介行业收费标准（2019-04昆明信息港）：二手买2%卖1%，租赁≤1月租金
      resale_buyer_rate: 0.02
      resale_seller_rate: 0.01
      channel_rate: 0.03           # 昆明新房渠道行情点位（演示，以项目合同为准）
    prepayment:                    # 提前还款（⑦-3）——各银行差异大，以下为常见行情，--set可覆盖
      penalty_rate: 0.0            # 违约金率（还款满1-3年多为0；未满期或部分银行收已还本金1%等）
      min_prepay: 10000            # 最低提前还款额（多数银行1万起、按万取整）
    newhome:
      _as_of: "昆明维修资金：高层90元/㎡（老何08-30口径）；其他类型为演示值待核对"
      repair_fund_table:
